name: Static website smoke test
on:
  pull_request:
    paths:
      - "preview-server.mjs"
      - "preview.html"
      - "data/**"
      - "start-site.command"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/preview-smoke.yml"
  push:
    branches: [main]
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate syntax
        run: |
          node --check preview-server.mjs
          node --check data/siteContent.js
      - name: Check preview HTTP response
        run: |
          PORT=37991 node preview-server.mjs >/tmp/heitao-preview.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          node --input-type=module -e '
            import assert from "node:assert/strict";
            let response;
            for (let i=0; i<40; i++) {
              try { response = await fetch("http://127.0.0.1:37991/"); break; }
              catch { await new Promise(resolve => setTimeout(resolve, 100)); }
            }
            assert.ok(response?.ok, "Preview server must respond");
            assert.match(response.headers.get("content-type"), /text\/html/);
            assert.match(await response.text(), /<html lang="zh-CN">/);
            const favicon = await fetch("http://127.0.0.1:37991/favicon.ico");
            assert.equal(favicon.status, 204);
            const missing = await fetch("http://127.0.0.1:37991/not-a-page");
            assert.equal(missing.status, 404, "Unknown routes must not return HTTP 200");
            const head = await fetch("http://127.0.0.1:37991/", {method:"HEAD"});
            assert.equal(head.status, 200);
            assert.equal(await head.text(), "");
            const post = await fetch("http://127.0.0.1:37991/", {method:"POST"});
            assert.equal(post.status, 405, "Preview server is read-only");
            assert.equal(post.headers.get("allow"), "GET, HEAD");
            assert.equal(response.headers.get("x-content-type-options"), "nosniff");
            console.log("Preview HTTP smoke test passed.");
          '
      - name: Generate static site without npm install
        run: node preview-server.mjs --write
      - name: Ensure committed preview matches generator
        run: git diff --exit-code -- preview.html
      - name: Check performance and content invariants
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const html = readFileSync("preview.html", "utf8");
            assert.match(html, /<html lang="zh-CN">/);
            assert.match(html, /rel="preload" as="image"/);
            assert.match(html, /fetchpriority="high"/);
            assert.match(html, /srcset="[^"]+640w, [^"]+1200w"/);
            assert.match(html, /media="\(min-width: 901px\)"/);
            assert.match(html, /imagesrcset="[^"]+640w, [^"]+1200w"/);
            assert.match(html, /imagesizes="\(max-width: 900px\) calc\(100vw - 40px\), 520px"/);
            assert.match(html, /media="\(max-width: 900px\)"/);
            assert.equal(html, readFileSync("dist/index.html", "utf8"));
            assert.doesNotMatch(html, /请替换|待更新|立即预约<\/a>/);
            assert.doesNotMatch(html, /储值金奖励|免费体验券/);
            assert.match(html, /不可兑换现金、实物或有价券/);
            assert.equal((html.match(/<img /g) || []).length, 7);
            assert.equal((html.match(/loading="lazy"/g) || []).length, 6);
            assert.doesNotMatch(html, /黑金俱乐部/);
            assert.match(html, /15:00 - 02:00/);
            console.log("Static preview smoke test passed.");
          '
